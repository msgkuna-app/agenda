<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ikon utama "any" Agenda & Arsip (Tema BPS) -->
  <defs>
    <linearGradient id="latarBiru" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B5FA5" />
      <stop offset="100%" stop-color="#084A84" />
    </linearGradient>
  </defs>

  <!-- Latar biru BPS dengan sudut membulat ~22% (112/512) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#latarBiru)" />

  <!-- Badan kalender putih kebiruan -->
  <rect x="96" y="116" width="320" height="308" rx="48" fill="#F4F8FC" />

  <!-- Takik dudukan cincin penjepit atas -->
  <rect x="158" y="104" width="52" height="54" rx="26" fill="url(#latarBiru)" />
  <rect x="302" y="104" width="52" height="54" rx="26" fill="url(#latarBiru)" />

  <!-- Dua cincin penjepit kalender -->
  <rect x="168" y="76" width="32" height="72" rx="16" fill="#F4F8FC" />
  <rect x="312" y="76" width="32" height="72" rx="16" fill="#F4F8FC" />

  <!-- Garis pemisah header kalender -->
  <rect x="96" y="198" width="320" height="18" fill="#084A84" />

  <!-- Tiga garis aksen arsip & statistik (Biru - Hijau - Oranye BPS) -->
  <rect x="144" y="248" width="224" height="28" rx="14" fill="#007BC2" />
  <rect x="144" y="302" width="176" height="28" rx="14" fill="#3B9428" />
  <rect x="144" y="356" width="128" height="28" rx="14" fill="#D8720D" />
</svg>
